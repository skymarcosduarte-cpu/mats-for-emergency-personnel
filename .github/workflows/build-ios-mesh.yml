name: Build IPA con Red Mesh (iOS)

# Cómo usarlo:
#   GitHub -> pestaña "Actions" -> "Build IPA con Red Mesh (iOS)" -> "Run workflow".
#   Al terminar (~15 min) descarga el artefacto "MATS-mesh-ipa".
#   El IPA sale SIN FIRMAR: se instala con AltStore / Sideloadly / una cuenta de
#   desarrollador. Para publicar en TestFlight hay que firmarlo con tu certificado.

on:
  workflow_dispatch:
  push:
    tags:
      - 'ipa-*'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          set -x
          rm -f bun.lockb bun.lock package-lock.json
          npm install --legacy-peer-deps --no-audit --no-fund
          gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document

      - name: Compilar la app web
        run: npx vite build

      - name: Usar assets locales (app offline, sin servidor remoto)
        run: |
          node -e "
          const fs=require('fs');
          let s=fs.readFileSync('capacitor.config.ts','utf8');
          s=s.replace(/\n\s*server:\s*\{[\s\S]*?\n\s*\},/, '');
          fs.writeFileSync('capacitor.config.ts', s);
          "

      - name: Añadir plataforma iOS
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi

      - name: Sincronizar
        run: npx cap sync ios

      - name: Instalar CocoaPods
        run: |
          set -x
          gem install cocoapods --no-document || sudo gem install cocoapods --no-document
          cd ios/App
          pod repo update || true
          pod install || pod install --repo-update

      - name: Instalar plugin de la malla + Info.plist
        run: bash native-plugins/install-ios.sh

      - name: Compilar (sin firmar)
        run: |
          set -euo pipefail
          cd ios/App
          if [ -d App.xcworkspace ]; then
            CONTAINER=(-workspace App.xcworkspace)
          elif [ -d App.xcodeproj ]; then
            CONTAINER=(-project App.xcodeproj)
          else
            echo "No se encontró App.xcworkspace ni App.xcodeproj"
            exit 1
          fi

          echo "Esquemas disponibles:"
          xcodebuild "${CONTAINER[@]}" -list
          xcodebuild "${CONTAINER[@]}" -resolvePackageDependencies
          xcodebuild "${CONTAINER[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verificar salida de compilación
        run: |
          echo "Contenido de Build/Products:"
          find ios/App/build/Build/Products -maxdepth 3 -print || true

      - name: Empaquetar IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find ios/App/build -type d -name '*.app' -path '*iphoneos*' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            APP_PATH="$(find ~/Library/Developer/Xcode/DerivedData ios/App/build -type d -name '*.app' -path '*iphoneos*' -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$APP_PATH" ]; then
            echo "No se encontró el .app después de compilar"
            find ios/App/build -maxdepth 5 -name '*.app' -print || true
            exit 1
          fi
          echo "Usando: $APP_PATH"
          OUTPUT="$GITHUB_WORKSPACE/ios-artifact"
          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT/Payload"
          cp -R "$APP_PATH" "$OUTPUT/Payload/App.app"
          (cd "$OUTPUT" && zip -qr MATS-mesh-unsigned.ipa Payload)
          ls -lh "$OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MATS-mesh-ipa
          path: ios-artifact/MATS-mesh-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
