name: Build IPA con Red Mesh (iOS)

# Cómo usarlo:
#   GitHub -> pestaña "Actions" -> "Build IPA con Red Mesh (iOS)" -> "Run workflow".
#   Al terminar (~15 min) descarga el artefacto "MATS-mesh-ipa".
#   Si falla, descarga "MATS-ios-build-log": contiene el registro COMPLETO.
#   El IPA sale SIN FIRMAR: se instala con AltStore / Sideloadly.

on:
  workflow_dispatch:
  push:
    tags:
      - 'ipa-*'

jobs:
  build:
    # macos-15 trae Xcode 16, compatible con Capacitor 8.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compilar todo (registro completo)
        id: build
        continue-on-error: true
        run: |
          set -x
          exec > >(tee -a "$GITHUB_WORKSPACE/ios-build.log") 2>&1

          sw_vers
          xcodebuild -version

          rm -f bun.lockb bun.lock package-lock.json
          npm install --legacy-peer-deps --no-audit --no-fund

          npx vite build

          # Usar assets locales (app offline, sin servidor remoto)
          node -e "
          const fs=require('fs');
          let s=fs.readFileSync('capacitor.config.ts','utf8');
          s=s.replace(/\n\s*server:\s*\{[\s\S]*?\n\s*\},/, '');
          fs.writeFileSync('capacitor.config.ts', s);
          "

          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios

          # --- Icono M.A.T.S. en el AppIcon de iOS ---
          SOURCE="$GITHUB_WORKSPACE/public/app-icon-1024.png"
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          test -f "$SOURCE"
          rm -rf "$ICONSET"; mkdir -p "$ICONSET"
          # 1024 sin canal alfa (requisito de Apple)
          sips -s format jpeg "$SOURCE" --out /tmp/icon.jpg >/dev/null
          sips -s format png /tmp/icon.jpg --out "$ICONSET/AppIcon-512@2x.png" >/dev/null
          sips -z 1024 1024 "$ICONSET/AppIcon-512@2x.png" >/dev/null
          cat > "$ICONSET/Contents.json" <<'EOF'
          {
            "images": [
              { "filename": "AppIcon-512@2x.png", "idiom": "universal", "platform": "ios", "size": "1024x1024" }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          EOF
          test -s "$ICONSET/AppIcon-512@2x.png"
          sips -g pixelWidth -g pixelHeight "$ICONSET/AppIcon-512@2x.png"



          # Plugin de la malla + permisos Info.plist (no debe abortar el build)
          sudo gem install xcodeproj --no-document || gem install xcodeproj --no-document || true
          bash native-plugins/install-ios.sh || echo "AVISO: install-ios.sh falló, se continúa"

          cd ios/App
          if [ -f Podfile ]; then
            # Usar el CocoaPods preinstalado del runner; si no existe, instalarlo
            command -v pod >/dev/null 2>&1 || brew install cocoapods || sudo gem install cocoapods --no-document || true
            pod install --repo-update || pod install || true
          fi


          if [ -d App.xcworkspace ]; then
            CONTAINER=(-workspace App.xcworkspace)
          else
            CONTAINER=(-project App.xcodeproj)
          fi

          xcodebuild "${CONTAINER[@]}" -list || true
          xcodebuild "${CONTAINER[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Empaquetar IPA
        id: pack
        continue-on-error: true
        run: |
          set -x
          exec > >(tee -a "$GITHUB_WORKSPACE/ios-build.log") 2>&1
          APP_PATH="$(find ios/App/build ~/Library/Developer/Xcode/DerivedData -type d -name '*.app' -path '*iphoneos*' -print -quit 2>/dev/null || true)"
          if [ -z "$APP_PATH" ]; then
            echo "No se encontró ningún .app compilado"
            exit 1
          fi
          OUTPUT="$GITHUB_WORKSPACE/ios-artifact"
          rm -rf "$OUTPUT"; mkdir -p "$OUTPUT/Payload"
          cp -R "$APP_PATH" "$OUTPUT/Payload/App.app"
          (cd "$OUTPUT" && zip -qr MATS-mesh-unsigned.ipa Payload)
          ls -lh "$OUTPUT"

      - name: Subir registro completo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MATS-ios-build-log
          path: ios-build.log
          retention-days: 14
          if-no-files-found: warn

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MATS-mesh-ipa
          path: ios-artifact/MATS-mesh-unsigned.ipa
          retention-days: 30
          if-no-files-found: warn

      - name: Resultado final
        run: |
          if [ ! -f ios-artifact/MATS-mesh-unsigned.ipa ]; then
            echo "La compilación falló. Descarga el artefacto MATS-ios-build-log para ver el error completo."
            exit 1
          fi
          echo "IPA generado correctamente."
