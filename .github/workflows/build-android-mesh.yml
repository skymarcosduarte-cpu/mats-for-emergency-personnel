name: Build APK con Red Mesh

# Cómo usarlo:
#   GitHub -> pestaña "Actions" -> "Build APK con Red Mesh" -> "Run workflow".
#   Al terminar (~10 min) descarga el artefacto "MATS-mesh-apk" y ábrelo en el
#   teléfono Android. No necesitas Android Studio ni SDK en tu computadora.
#   Requiere que el repo esté sincronizado con la última versión de Lovable.

on:
  workflow_dispatch:
  push:
    tags:
      - 'apk-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: |
          set -x
          rm -f bun.lockb bun.lock package-lock.json
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Compilar la app web
        run: npx vite build

      - name: Verificar versión y funciones Mesh incluidas
        run: |
          set -euo pipefail
          APP_VERSION=$(node -e "const s=require('fs').readFileSync('src/lib/versionCheck.ts','utf8');console.log(s.match(/APP_VERSION\s*=\s*'([^']+)'/)[1])")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Compilando MATS v$APP_VERSION"
          grep -Rqs "BUZÓN DE MENSAJES MESH" dist/assets || {
            echo "Error: el buzón Mesh no está en el bundle compilado"; exit 1; }
          grep -Rqs "MESH_HELLO" dist/assets || {
            echo "Error: el descubrimiento MESH_HELLO no está en el bundle"; exit 1; }
          test -f src/lib/meshPins.ts

      - name: Usar assets locales (app offline, sin servidor remoto)
        run: |
          node -e "
          const fs=require('fs');
          let s=fs.readFileSync('capacitor.config.ts','utf8');
          s=s.replace(/\n\s*server:\s*\{[\s\S]*?\n\s*\},/, '');
          fs.writeFileSync('capacitor.config.ts', s);
          "

      - name: Añadir plataforma Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sincronizar
        run: npx cap sync android

      - name: Fijar versionName/versionCode con la versión de la app
        run: |
          set -euo pipefail
          GRADLE=android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${APP_VERSION}\"/" "$GRADLE"
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" "$GRADLE"
          grep -n "versionName\|versionCode" "$GRADLE"


      - name: Reemplazar todos los iconos Android con el logo MATS
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

          RES=android/app/src/main/res
          SOURCE=public/app-icon-1024.png
          test -f "$SOURCE"

          # Elimina primero TODOS los launchers generados por Capacitor (png,
          # webp, xml, en mipmap-* y drawable-*) para que Android/One UI nunca
          # pueda elegir el icono genérico por prioridad de densidad.
          find "$RES" -type f -name 'ic_launcher*' -delete


          # Iconos legacy y foreground adaptativo para todas las densidades.
          make_icons() {
            density="$1"
            legacy="$2"
            foreground="$3"
            dir="$RES/mipmap-$density"
            mkdir -p "$dir"
            convert "$SOURCE" -resize "${legacy}x${legacy}" \
              -gravity center -extent "${legacy}x${legacy}" "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            convert "$SOURCE" -resize "$((foreground * 72 / 100))x$((foreground * 72 / 100))" \
              -background none -gravity center -extent "${foreground}x${foreground}" \
              "$dir/ic_launcher_foreground.png"
          }

          make_icons mdpi 48 108
          make_icons hdpi 72 162
          make_icons xhdpi 96 216
          make_icons xxhdpi 144 324
          make_icons xxxhdpi 192 432

          mkdir -p "$RES/mipmap-anydpi-v26" "$RES/values"
          cat > "$RES/values/mats_icon_colors.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="mats_launcher_background">#0F7A3C</color>
          </resources>
          EOF
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/mats_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" \
             "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          # El build falla si falta una variante o si quedó algún launcher webp.
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "$RES/mipmap-$density/ic_launcher.png"
            test -s "$RES/mipmap-$density/ic_launcher_round.png"
            test -s "$RES/mipmap-$density/ic_launcher_foreground.png"
          done
          if find "$RES" -type f -name 'ic_launcher*.webp' | grep -q .; then
            echo 'Error: todavía existe un icono genérico WebP'
            exit 1
          fi

          # El manifiesto debe apuntar a nuestros mipmaps (icono + icono redondo).
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "$MANIFEST" || \
            sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"#' "$MANIFEST"
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "$MANIFEST"

          identify "$RES/mipmap-xxxhdpi/ic_launcher.png" \
                   "$RES/mipmap-xxxhdpi/ic_launcher_foreground.png"




      - name: Instalar plugins de la malla
        run: bash native-plugins/install-android.sh

      - name: Parchear AndroidManifest (permisos BLE + servicio)
        run: node native-plugins/patch-android-manifest.mjs

      - name: Escribir MainActivity canónico (mesh + zoom fijo)
        run: node native-plugins/write-android-mainactivity.mjs


      - name: Validar configuración nativa
        run: |
          set -euo pipefail
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -1)
          test -n "$MAIN"
          ONCREATE_COUNT=$(grep -c 'void onCreate' "$MAIN")
          if [ "$ONCREATE_COUNT" -ne 1 ]; then
            echo "Error: MainActivity debe contener exactamente un método onCreate; se encontraron $ONCREATE_COUNT."
            sed -n '1,160p' "$MAIN"
            exit 1
          fi
          grep -q 'MeshAdvertiserPlugin.class' "$MAIN"
          grep -q 'MeshForegroundServicePlugin.class' "$MAIN"
          grep -q 'setTextZoom(100)' "$MAIN"

          # Permisos y servicio de la malla en el manifiesto
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for perm in BLUETOOTH_SCAN BLUETOOTH_ADVERTISE BLUETOOTH_CONNECT ACCESS_FINE_LOCATION FOREGROUND_SERVICE; do
            grep -q "android.permission.$perm" "$MANIFEST" || {
              echo "Error: falta el permiso $perm en AndroidManifest.xml"; exit 1; }
          done
          grep -q 'MeshForegroundService' "$MANIFEST" || {
            echo "Error: falta el <service> de la malla en AndroidManifest.xml"; exit 1; }

          # Clases nativas de la malla presentes en el proyecto
          find android/app/src/main/java -name 'MeshAdvertiserPlugin.java' | grep -q . || {
            echo "Error: no se copió MeshAdvertiserPlugin.java"; exit 1; }
          find android/app/src/main/java -name 'MeshForegroundService*.java' | grep -q . || {
            echo "Error: no se copiaron las clases del servicio de la malla"; exit 1; }


      - name: Ajustar memoria de Gradle
        run: |
          mkdir -p android
          {
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.parallel=false"
            echo "org.gradle.daemon=false"
            echo "android.useAndroidX=true"
            echo "android.enableJetifier=true"
          } >> android/gradle.properties

      - name: Compilar APK de depuración (con reintento)
        run: |
          cd android && chmod +x gradlew
          for i in 1 2; do
            ./gradlew assembleDebug --no-daemon --stacktrace && exit 0
            echo "Intento $i falló, reintentando en 20s..."
            ./gradlew --stop || true
            sleep 20
          done
          exit 1


      - name: Renombrar APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/*.apk release/MATS-RedMesh.apk

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MATS-mesh-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Crear Release público con APK
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: MATS ${{ env.APP_VERSION }} Red Mesh APK #${{ github.run_number }}

          body: |
            APK de depuración con Red Mesh activada.

            **Para instalar:**
            1. Descarga el archivo .apk abajo
            2. Ábrelo en tu Android (acepta "instalar apps desconocidas")
            3. Si Google Play Protect lo bloquea, toca "Instalar de todos modos"
            4. Abre la app → Red Mesh → activa el interruptor
          files: release/MATS-RedMesh.apk
          prerelease: false
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
